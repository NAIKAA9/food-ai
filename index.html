<!DOCTYPE html>
<html lang="en">

  <meta name="google-site-verification" content="ad5xSF75uh-eU1Bq95IE2SqvErlO_qvwZWoad6x56-o" />
  <meta name="geo.region" content="IN-TG" />
  <meta name="geo.placename" content="Kothagudem" />
  <meta name="geo.position" content="17.554019;80.617638" />
  <meta name="ICBM" content="17.554019, 80.617638" />
  <meta name="author" content="Eslavath Narasimha Naik" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Recipe Generator — Ultra Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    :root {
      --accent1: #ff7e5f;
      --accent2: #feb47b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #fffaf0, #ffe8d6);
      color: #1b1b1b;
    }
    header {
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      color: #fff;
      padding: 30px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    header h1 {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    }
    .wrap {
      max-width: 1200px;
      margin: 40px auto;
      padding: 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }
    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls input,
    .controls select {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    .controls button {
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(45deg, var(--accent1), var(--accent2));
      border: none;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .controls button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
      margin-top: 24px;
    }
    .food-item {
      background: #fffaf5;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ffd9b3;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .food-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    }
    .food-item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .food-item .title {
      padding: 10px 12px;
      font-weight: 600;
      text-align: center;
    }
    .output {
      background: #fff7f0;
      padding: 18px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.03);
    }
    .recipe-image {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .step {
      background: #fff0e1;
      border-left: 6px solid var(--accent1);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .meta {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Recipe Generator 🍴</h1>
  </header>
  <main class="wrap">
    <section class="controls">
      <input id="searchInput" type="text" placeholder="Search food, dessert, or drink..." />
      <select id="categorySelect">
        <option value="all">All</option>
        <option value="meals">Meals</option>
        <option value="non-meals">Non-meals</option>
      </select>
      <button id="generateBtn">Generate Recipe</button>
      <button class="secondary" id="testBtn">Run Tests</button>
    </section>

    <section class="grid" id="foodGrid"></section>

    <section class="output" id="output"></section>
  </main>

  <script>
    const foods = [
      { name: 'Chicken Biryani', type: 'meals', img: 'download.jpg', ingredients: ['Basmati rice', 'Chicken', 'Yogurt', 'Spices', 'Onions'], steps: ['Marinate chicken with yogurt and spices.', 'Fry onions until golden.', 'Layer rice and chicken.', 'Cook on dum for 30 minutes.'] },
      { name: 'Hyderabadi Chicken Dum Biryani', type: 'meals', img: 'hyb.jpg', ingredients: ['Chicken', 'Rice', 'Saffron', 'Fried onions', 'Mint'], steps: ['Marinate chicken overnight.', 'Partially cook rice.', 'Layer with saffron and mint.', 'Seal lid and cook on dum for 45 minutes.'] },
      { name: 'Mutton Biryani', type: 'meals', img: 'mutton.jpg', ingredients: ['Mutton', 'Rice', 'Yogurt', 'Spices'], steps: ['Pressure cook mutton.', 'Layer rice and mutton.', 'Cook together until aromatic.'] },
      { name: 'Keema Biryani', type: 'meals', img: 'k.jpg', ingredients: ['Minced meat', 'Rice', 'Onions', 'Spices'], steps: ['Cook keema with onions.', 'Add rice and mix well.', 'Garnish with fried onions.'] },
      { name: 'Fish Biryani', type: 'meals', img: 'f.jpg', ingredients: ['Fish fillets', 'Basmati rice', 'Spices', 'Lemon juice'], steps: ['Marinate fish.', 'Fry lightly.', 'Layer with rice and steam for 20 minutes.'] },
      { name: 'Grains', type: 'non-meals', img: 's.jpg', ingredients: ['Wheat', 'Rice', 'Barley'], steps: ['Clean grains thoroughly.', 'Store in airtight containers.'] },
      { name: 'Legumes', type: 'non-meals', img: 'r.jpg', ingredients: ['Lentils', 'Beans', 'Peas'], steps: ['Soak legumes for 6 hours.', 'Cook or pressure cook depending on type.'] },
      { name: 'Dairy', type: 'non-meals', img: 'm.jpg', ingredients: ['Milk', 'Curd', 'Butter', 'Cheese'], steps: ['Boil milk.', 'Store at proper temperature.', 'Use fresh dairy in recipes.'] },
      { name: 'Vegetables', type: 'non-meals', img: 'v.jpg', ingredients: ['Tomatoes', 'Potatoes', 'Onions', 'Leafy greens'], steps: ['Wash thoroughly.', 'Chop as required.', 'Cook or serve fresh.'] }
    ];

    function populateGrid() {
      const grid = document.getElementById('foodGrid');
      grid.innerHTML = '';
      foods.forEach(food => {
        const div = document.createElement('div');
        div.className = 'food-item';
        div.innerHTML = `<img src="${food.img}" alt="${food.name}"><div class='title'>${food.name}</div>`;
        div.addEventListener('click', () => displayRecipe(food));
        grid.appendChild(div);
      });
    }

    function displayRecipe(food) {
      const output = document.getElementById('output');
      output.innerHTML = `<img class='recipe-image' src='${food.img}' alt='${food.name}'><h2>${food.name}</h2><h3>Ingredients:</h3><ul>${food.ingredients.map(i => `<li>${i}</li>`).join('')}</ul><h3>Steps:</h3>${food.steps.map(s => `<div class='step'>${s}</div>`).join('')}<div class='meta'>Type: ${food.type}</div>`;
    }

    function generateRecipe() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categorySelect').value;
      const found = foods.find(f => f.name.toLowerCase().includes(search) && (category === 'all' || f.type === category));
      if(found) displayRecipe(found); else document.getElementById('output').innerHTML = '<p>No matching recipe found. Try a different name.</p>';
    }

    document.getElementById('generateBtn').addEventListener('click', generateRecipe);

    window.addEventListener('DOMContentLoaded', populateGrid);
  </script>
</body>
</html>
